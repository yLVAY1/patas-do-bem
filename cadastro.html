<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Patas do Bem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fffaf4;
            color: #333;
        }
        main {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }
        fieldset {
            margin-bottom: 20px;
            border: 1px solid #315b35;
            border-radius: 5px;
        }
        legend {
            font-weight: bold;
            color: #315b35;
        }
        label {
            display: block;
            margin-top: 12px;
        }
        input, select {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
        }
        button {
            background: #315b35;
            color: white;
            padding: 12px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<main>
    <h1>Cadastro de Voluntários</h1>
    <p>Preencha os dados para participar
    do projeto Patas do Bem.</p>

    <form action="#" method="get">

        <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome"
                   name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email"
                   name="email" required>

            <label for="nascimento">
                Data de nascimento:
            </label>
            <input type="date" id="nascimento"
                   name="nascimento" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf"
                   pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                   placeholder="000.000.000-00"
                   title="Digite o CPF no formato 000.000.000-00"
                   required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone"
                   name="telefone"
                   pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                   placeholder="(41) 99999-9999"
                   title="Digite no formato (41) 99999-9999"
                   required>
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco"
                   name="endereco" required>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade"
                   name="cidade" required>

            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
                <option value="">Selecione</option>
                <option value="PR">Paraná</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
                <option value="outro">Outro estado</option>
            </select>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep"
                   pattern="[0-9]{5}-[0-9]{3}"
                   placeholder="00000-000"
                   title="Digite o CEP no formato 00000-000"
                   required>
        </fieldset>

        <button type="submit">Enviar cadastro</button>

    </form>

    <p>Este formulário é demonstrativo.
    Não armazena os dados informados.</p>

    <a href="index.html">Voltar ao início</a>
</main>

</body>
</html>
